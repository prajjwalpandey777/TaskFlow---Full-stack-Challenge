<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TASKFLOW – Smart Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark"><i data-lucide="zap"></i></span><span>TASKFLOW</span></div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button>
      <button class="nav-item" data-view="all"><i data-lucide="list"></i>All Tasks</button>
      <button class="nav-item" data-view="pending"><i data-lucide="clock"></i>Pending Tasks</button>
      <button class="nav-item" data-view="completed"><i data-lucide="check-circle-2"></i>Completed Tasks</button>
      <p class="nav-label">Priority</p>
      <button class="nav-item" data-view="High"><i data-lucide="flame"></i>High Priority</button>
      <button class="nav-item" data-view="Medium"><i data-lucide="signal-medium"></i>Medium Priority</button>
      <button class="nav-item" data-view="Low"><i data-lucide="signal-low"></i>Low Priority</button>
    </nav>
    <button class="nav-item theme-btn" id="themeToggle"><i data-lucide="sun-moon"></i><span id="themeLabel">Light theme</span></button>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main">
    <header class="header">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><i data-lucide="menu"></i></button>
      <div class="welcome">
        <h1 id="welcomeText">Welcome back</h1>
        <p id="todayDate"></p>
      </div>
      <div class="search">
        <i data-lucide="search"></i>
        <input type="search" id="searchInput" placeholder="Search tasks, categories…" aria-label="Search tasks" />
      </div>
      <button class="btn primary" id="addBtn"><i data-lucide="plus"></i><span>Add Task</span></button>
    </header>

    <section class="stats" id="stats">
      <article class="card stat"><span class="stat-label">Total Tasks</span><strong id="statTotal">0</strong></article>
      <article class="card stat"><span class="stat-label">Completed</span><strong id="statCompleted" class="green">0</strong></article>
      <article class="card stat"><span class="stat-label">Pending</span><strong id="statPending">0</strong></article>
      <article class="card stat">
        <span class="stat-label">Completion</span><strong id="statPercent" class="accent">0%</strong>
        <div class="progress"><div id="progressBar"></div></div>
      </article>
    </section>

    <section class="toolbar">
      <h2 id="viewTitle">Dashboard</h2>
      <div class="filters">
        <div class="seg" id="statusSeg">
          <button data-status="all" class="active">All</button>
          <button data-status="pending">Pending</button>
          <button data-status="completed">Completed</button>
        </div>
        <select id="priorityFilter" aria-label="Priority filter">
          <option value="all">Any priority</option><option>High</option><option>Medium</option><option>Low</option>
        </select>
        <select id="sortSelect" aria-label="Sort tasks">
          <option value="newest">Newest first</option><option value="oldest">Oldest first</option>
          <option value="due">Due date</option><option value="priority">Priority</option>
        </select>
      </div>
    </section>

    <section class="tasks" id="taskList" aria-live="polite"></section>
    <div class="loader" id="loader"><span></span>Loading tasks…</div>
    <div class="empty" id="empty" hidden>
      <i data-lucide="clipboard-list"></i>
      <h3>No tasks here yet</h3>
      <p>Add a task to start tracking your work.</p>
      <button class="btn primary" id="emptyAdd"><i data-lucide="plus"></i>Add Task</button>
    </div>
  </main>

  <!-- ===== TASK MODAL ===== -->
  <div class="modal" id="taskModal" hidden>
    <form class="dialog" id="taskForm" novalidate>
      <div class="dialog-head"><h3 id="modalTitle">New task</h3><button type="button" class="icon-btn" data-close aria-label="Close"><i data-lucide="x"></i></button></div>
      <label>Title *<input id="fTitle" maxlength="120" placeholder="e.g. Finish API documentation" /><small class="err" id="eTitle"></small></label>
      <label>Description<textarea id="fDesc" rows="3" maxlength="1000" placeholder="Optional details"></textarea></label>
      <div class="row">
        <label>Priority<select id="fPriority"><option>High</option><option selected>Medium</option><option>Low</option></select></label>
        <label>Category<input id="fCategory" maxlength="40" placeholder="General" list="catList" /><datalist id="catList"><option>Work</option><option>Study</option><option>Personal</option><option>Club</option></datalist></label>
      </div>
      <label>Due date<input type="date" id="fDue" /><small class="err" id="eDue"></small></label>
      <div class="dialog-foot">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Save task</button>
      </div>
    </form>
  </div>

  <!-- ===== CONFIRM DIALOG ===== -->
  <div class="modal" id="confirmModal" hidden>
    <div class="dialog small">
      <h3>Delete this task?</h3>
      <p id="confirmText">This cannot be undone.</p>
      <div class="dialog-foot">
        <button class="btn ghost" id="confirmNo">Keep task</button>
        <button class="btn danger" id="confirmYes">Delete task</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
